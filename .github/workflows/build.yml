name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
  merge_group:
    branches: [master]
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe50206 # v7.0.0
        with:
          node-version: "lts/*"
          cache: yarn

      - name: yarn install, build, test and lint
        run: |
          yarn install
          yarn run test
          yarn run build
          yarn run lint
